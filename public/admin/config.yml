# Sveltia CMS – redigeringsløsning for heartofgold.no
#
# base_url må peke på innloggingstjenesten (en Cloudflare Worker som kjører
# sveltia/sveltia-cms-auth). Se docs/cms-oppsett.md for hvordan den settes opp.

backend:
  name: github
  repo: HoGEidskog/heartofgold
  branch: main
  base_url: https://sveltia-cms-auth.heart-of-gold-eidskog.workers.dev

locale: no
publish_mode: simple
media_folder: public/bilder
public_folder: /bilder

collections:
  - name: nyheter
    label: Nyheter
    label_singular: Nyhet
    folder: src/content/nyheter
    create: true
    slug: '{{year}}-{{month}}-{{slug}}'
    summary: '{{dato | date("DD.MM.YYYY")}} – {{tittel}}'
    sortable_fields: [dato, tittel]
    view_filters:
      - label: I år
        field: dato
        pattern: '2026'
    fields:
      - { name: tittel, label: Overskrift, widget: string }
      - { name: dato, label: Dato, widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD.MM.YYYY', time_format: false, picker_utc: true }
      - { name: ingress, label: Ingress, widget: text, required: false, hint: 'Én til to setninger som vises i listen og på forsiden.' }
      - { name: bilde, label: Hovedbilde, widget: image, required: false }
      - { name: bildetekst, label: Bildetekst, widget: string, required: false }
      - { name: body, label: Tekst, widget: markdown }

  - name: prosjekter
    label: Prosjekter
    label_singular: Prosjekt
    folder: src/content/prosjekter
    create: true
    slug: '{{aar}}-{{slug}}'
    summary: '{{aar}} – {{tittel}}'
    sortable_fields: [aar, belop, tittel]
    fields:
      - { name: aar, label: År, widget: number, value_type: int, min: 2001, max: 2100 }
      - { name: maned, label: Måned, widget: string, required: false, hint: 'F.eks. Februar. Kan stå tomt.' }
      - { name: tittel, label: Tittel, widget: string }
      - { name: mottaker, label: Hvem fikk pengene, widget: string, required: false }
      - { name: belop, label: Beløp i kroner, widget: number, value_type: int, required: false }
      - name: type
        label: Type arrangement
        widget: select
        default: dugnad
        options:
          - { label: Konsert, value: konsert }
          - { label: Quizkveld, value: quiz }
          - { label: Dugnad eller annet arrangement, value: dugnad }
          - { label: Direkte støtte, value: stotte }
      - { name: medvirkende, label: Medvirkende, widget: list, required: false, hint: 'Ett navn eller band per linje.' }
      - { name: konferansier, label: Konferansier, widget: string, required: false }
      - { name: bilde, label: Utvalgt bilde, widget: image, required: false, hint: 'Bildet som vises i oversikten over prosjekter. Står det tomt, brukes det første bildet i galleriet.' }
      - { name: bildetekst, label: Bildetekst, widget: string, required: false }
      - { name: bildekreditering, label: Fotograf, widget: string, required: false }
      - name: bilder
        label: Bildegalleri
        label_singular: Bilde
        widget: list
        required: false
        hint: 'Bilder fra arrangementet. Vises på prosjektets egen side, ikke i oversikten.'
        summary: '{{fields.tekst}}'
        fields:
          - { name: fil, label: Bilde, widget: image }
          - { name: tekst, label: Bildetekst, widget: string, required: false }
          - { name: kreditering, label: Fotograf, widget: string, required: false }
      - { name: hjelpere, label: Gode hjelpere, widget: relation, required: false, multiple: true,
          collection: hjelpere, search_fields: [navn], value_field: '{{slug}}', display_fields: [navn],
          hint: 'Hvem stilte opp med lokale, premier eller servering?' }
      - name: serie
        label: Del av et langvarig arbeid
        widget: select
        required: false
        hint: 'Knytter prosjektet til en egen temaside. La stå tomt for vanlige prosjekter.'
        options:
          - { label: Skolen og barnehjemmet i Nepal, value: nepal }
      - { name: utfylt, label: Ferdig utfylt, widget: boolean, default: true, hint: 'Slå av så lenge oppføringen bare er en plassholder.' }
      - { name: body, label: Beskrivelse, widget: markdown }

  - name: innstillinger
    label: Innstillinger
    files:
      - name: nettsted
        label: Forsiden
        file: src/data/nettsted.json
        fields:
          - { name: jubileum, label: Vis jubileumskavalkaden, widget: boolean, default: true, hint: 'Slå av når jubileumsåret er over. Da forsvinner hele seksjonen fra forsiden.' }
          - { name: jubileumsaar, label: Jubileumsår, widget: number, value_type: int }
          - { name: jubileumstittel, label: Overskrift, widget: string }
          - { name: jubileumsingress, label: Ingress, widget: text }

  - name: galleri
    label: Bildegalleri
    files:
      - name: bilder
        label: Bilder
        file: src/data/galleri.json
        fields:
          - name: bilder
            label: Bilder
            widget: list
            fields:
              - { name: fil, label: Bilde, widget: image }
              - { name: tekst, label: Bildetekst, widget: string }
              - { name: aar, label: År, widget: string, required: false }
              - { name: kreditering, label: Fotograf, widget: string, required: false }

  - name: nepal
    label: Nytt fra Nepal
    label_singular: Oppdatering
    folder: src/content/nepal
    create: true
    slug: '{{year}}-{{month}}-{{slug}}'
    summary: '{{dato | date("DD.MM.YYYY")}} – {{tittel}}'
    sortable_fields: [dato, tittel]
    fields:
      - { name: tittel, label: Overskrift, widget: string }
      - { name: dato, label: Dato, widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD.MM.YYYY', time_format: false, picker_utc: true }
      - { name: ingress, label: Ingress, widget: text, required: false }
      - { name: bilde, label: Hovedbilde, widget: image, required: false }
      - { name: bildetekst, label: Bildetekst, widget: string, required: false }
      - name: bilder
        label: Flere bilder
        label_singular: Bilde
        widget: list
        required: false
        summary: '{{fields.tekst}}'
        fields:
          - { name: fil, label: Bilde, widget: image }
          - { name: tekst, label: Bildetekst, widget: string, required: false }
          - { name: kreditering, label: Fotograf, widget: string, required: false }
      - name: videoer
        label: Videosnutter
        label_singular: Video
        widget: list
        required: false
        summary: '{{fields.tekst}}'
        hint: 'Korte klipp fra skolen. Husk stillbilde til hvert klipp – uten det står ruta svart til noen trykker play.'
        fields:
          - { name: fil, label: Videofil, widget: file, hint: 'MP4. Maks 25 MB – en rå telefonvideo på ett minutt er gjerne fem ganger så stor og må komprimeres først. Er den for stor, stopper publiseringen.' }
          - { name: plakat, label: Stillbilde, widget: image, required: false, hint: 'Vises før avspilling. Ta gjerne et skjermbilde fra klippet.' }
          - { name: tekst, label: Bildetekst, widget: string, required: false }
          - { name: kreditering, label: Filmet av, widget: string, required: false }
      - { name: body, label: Tekst, widget: markdown }

  - name: hjelpere
    label: Gode hjelpere
    label_singular: Hjelper
    folder: src/content/hjelpere
    create: true
    slug: '{{slug}}'
    summary: '{{navn}}'
    sortable_fields: [rekkefolge, navn]
    fields:
      - { name: navn, label: Navn, widget: string }
      - { name: logo, label: Logo, widget: image, required: false, hint: 'Be bedriften om logoen. Uten logo vises navnet som tekst, og siden ser like hel ut.' }
      - { name: bilde, label: Bilde, widget: image, required: false }
      - { name: bildetekst, label: Bildetekst, widget: string, required: false }
      - { name: lenke, label: Nettside, widget: string, required: false }
      - { name: rekkefolge, label: Rekkefølge, widget: number, value_type: int, default: 50, hint: 'Lavere tall kommer først.' }
      - { name: body, label: Beskrivelse, widget: markdown }

  - name: sider
    label: Faste sider
    files:
      - name: om-oss
        label: Om oss
        file: src/content/sider/om-oss.md
        fields:
          - { name: merkelapp, label: Merkelapp, widget: string, hint: 'Den lille teksten over overskriften.' }
          - { name: tittel, label: Overskrift, widget: string }
          - { name: undertekst, label: Undertekst, widget: string, required: false }
          - { name: bilde, label: Toppbilde, widget: image, required: false }
          - { name: bildetekst, label: Bildebeskrivelse, widget: string, required: false, hint: 'Beskriver bildet for dem som ikke ser det. Vises ikke på siden.' }
          - { name: body, label: Tekst, widget: markdown, hint: 'Skriv {{totalt}} der det samlede beløpet skal stå. Det regnes ut fra prosjektene og oppdaterer seg selv – ikke skriv tallet for hånd.' }
      - name: kontakt
        label: Kontakt
        file: src/content/sider/kontakt.md
        fields:
          - { name: merkelapp, label: Merkelapp, widget: string }
          - { name: tittel, label: Overskrift, widget: string }
          - { name: undertekst, label: Undertekst, widget: text, required: false }
          - { name: epost, label: Felles e-postadresse, widget: string, required: false, hint: 'Vises i den store fargede boksen. Står den tom, forsvinner boksen helt.' }
          - { name: facebook, label: Facebook-side, widget: string, required: false, hint: 'Full adresse. Brukes i bunnteksten på alle sider.' }
          - name: personer
            label: Kontaktbokser
            label_singular: Kontaktboks
            widget: list
            required: false
            summary: '{{fields.navn}}'
            hint: 'Legg til, fjern eller flytt om på boksene. Er lista tom, vises ingen bokser.'
            fields:
              - { name: navn, label: Navn, widget: string }
              - { name: rolle, label: Rolle eller yrke, widget: string, required: false }
              - { name: telefon, label: Telefon, widget: string, required: false, hint: 'Skriv nummeret slik det skal vises, for eksempel 413 39 911. Landkoden legges på automatisk.' }
              - { name: epost, label: E-post, widget: string, required: false }
          - { name: body, label: Tekst nederst, widget: markdown, hint: 'Vises under kontaktboksene. Her ligger blant annet lenka til Facebook-siden.' }
